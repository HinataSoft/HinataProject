name: Docker Image CI

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v3

    - name: Set up .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: '8.0.x' # Specify your .NET version here

    - name: Install xmllint
      run: sudo apt-get update && sudo apt-get install -y libxml2-utils

    - name: Extract VersionPrefix
      id: extract_versionprefix
      run: |
        VERSION_PREFIX=$(xmllint --xpath "string(//VersionPrefix)" Directory.Build.props)
        echo "VERSION_PREFIX=${VERSION_PREFIX}" >> $GITHUB_ENV
      shell: bash

    - name: Set image tag
      id: set_image_tag
      run: |
        BRANCH_NAME=$(echo "${{ github.ref }}" | sed 's/refs\/heads\///')
        if [ "${{ github.ref }}" == "refs/heads/main" ]; then
          IMAGE_TAG=${VERSION_PREFIX}
        elif [ "${{ github.ref }}" == "refs/heads/develop" ]; then
          IMAGE_TAG="${VERSION_PREFIX}-preview"
        else
          IMAGE_TAG="${VERSION_PREFIX}-${BRANCH_NAME}"
        fi
        echo "IMAGE_TAG=${IMAGE_TAG}" >> $GITHUB_ENV
        echo "BRANCH_NAME=${BRANCH_NAME}" >> $GITHUB_ENV
      shell: bash
      
    - name: Build the Docker image
      run: |
        docker build \
          --build-arg nuget_source=${{ vars.NUGET_SOURCE }} \
          --build-arg nuget_username=${{ vars.NUGET_USERNAME }} \
          --build-arg nuget_secret=${{ secrets.NUGET_SECRET }} \
          -f Dockerfile \
          -t ${{ vars.CONTAINER_REGISTRY }}/hinatasoft/hinataproject:${{ env.IMAGE_TAG }} \
          .

    - name: Login to Docker Registry
      uses: docker/login-action@v2
      with:
        registry: ${{ vars.CONTAINER_REGISTRY }}
        username: ${{ vars.CONTAINER_REGISTRY_USER }}
        password: ${{ secrets.CONTAINER_REGISTRY_SECRET }}

    - name: Push Docker image
      run: docker push ${{ vars.CONTAINER_REGISTRY }}/hinatasoft/hinataproject:${{ env.IMAGE_TAG }}

    - name: Retag Docker image
      run: |
        if [ "${{ github.ref }}" == "refs/heads/main" ]; then
          docker tag ${{ vars.CONTAINER_REGISTRY }}/hinatasoft/hinataproject:${{ env.IMAGE_TAG }} ${{ vars.CONTAINER_REGISTRY }}/hinatasoft/hinataproject:latest
          docker push ${{ vars.CONTAINER_REGISTRY }}/hinatasoft/hinataproject:latest
        elif [ "${{ github.ref }}" == "refs/heads/develop" ]; then
          docker tag ${{ vars.CONTAINER_REGISTRY }}/hinatasoft/hinataproject:${{ env.IMAGE_TAG }} ${{ vars.CONTAINER_REGISTRY }}/hinatasoft/hinataproject:preview
          docker push ${{ vars.CONTAINER_REGISTRY }}/hinatasoft/hinataproject:preview
        else
          docker tag ${{ vars.CONTAINER_REGISTRY }}/hinatasoft/hinataproject:${{ env.IMAGE_TAG }} ${{ vars.CONTAINER_REGISTRY }}/hinatasoft/hinataproject:${{ env.BRANCH_NAME }}
          docker push ${{ vars.CONTAINER_REGISTRY }}/hinatasoft/hinataproject:${{ env.BRANCH_NAME }}
        fi
      shell: bash
